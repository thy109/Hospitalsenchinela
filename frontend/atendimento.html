
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atendimento | Hospital</title>


    <!-- =========================================
         FONTES
    ========================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================
           RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           PÁGINA
        ========================================== */

        body {

            font-family: "Montserrat", sans-serif;

            background: #E8EEF2;

            color: #263746;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        /* =========================================
           CARD PRINCIPAL
        ========================================== */

        .container {

            width: 100%;

            max-width: 510px;

            background: #F8FAFB;

            padding: 44px;

            border-radius: 20px;

            border: 1px solid #D8E1E7;

            box-shadow:
                0 18px 45px rgba(11, 34, 57, 0.12);
        }


        /* =========================================
           IDENTIDADE DO HOSPITAL
        ========================================== */

        .hospital-logo {

            display: flex;

            align-items: center;

            gap: 13px;

            margin-bottom: 38px;
        }


        .logo-icon {

            width: 44px;

            height: 44px;

            background: #0B2239;

            color: #FFFFFF;

            border-radius: 11px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: "Montserrat", sans-serif;

            font-size: 22px;

            font-weight: 500;
        }


        .hospital-name {

            color: #0B2239;

            font-family: "Cormorant Garamond", serif;

            font-size: 23px;

            font-weight: 700;

            letter-spacing: 0.3px;
        }


        .hospital-subtitle {

            color: #718493;

            font-family: "Montserrat", sans-serif;

            font-size: 10px;

            letter-spacing: 0.4px;

            margin-top: 1px;
        }


        /* =========================================
           TÍTULO
        ========================================== */

        .title-area {

            margin-bottom: 30px;
        }


        .title-area h1 {

            color: #0B2239;

            font-family: "Cormorant Garamond", serif;

            font-size: 42px;

            font-weight: 600;

            line-height: 1;

            margin-bottom: 10px;
        }


        .title-area p {

            color: #687B88;

            font-family: "Montserrat", sans-serif;

            font-size: 12px;

            line-height: 1.7;

            max-width: 420px;
        }


        /* =========================================
           CAMPOS
        ========================================== */

        .campo {

            margin-bottom: 19px;
        }


        .campo label {

            display: block;

            color: #304555;

            font-family: "Montserrat", sans-serif;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.2px;

            margin-bottom: 8px;
        }


        input,
        select {

            width: 100%;

            height: 51px;

            padding: 0 15px;

            border: 1px solid #D4DEE5;

            border-radius: 9px;

            background: #EEF2F4;

            color: #263746;

            font-family: "Montserrat", sans-serif;

            font-size: 12px;

            outline: none;

            transition: all 0.25s ease;
        }


        input::placeholder {

            color: #82919B;
        }


        /* =========================================
           FOCO
        ========================================== */

        input:focus,
        select:focus {

            background: #FFFFFF;

            border-color: #0B2239;

            box-shadow:
                0 0 0 3px rgba(11, 34, 57, 0.07);
        }


        select {

            cursor: pointer;
        }


        /* =========================================
           UPLOAD
        ========================================== */

        .upload-area {

            background: #EEF2F4;

            border: 1px dashed #B8C6CF;

            border-radius: 9px;

            padding: 13px;

            transition: 0.25s ease;
        }


        .upload-area:hover {

            background: #E9EFF2;

            border-color: #0B2239;
        }


        input[type="file"] {

            height: auto;

            padding: 3px;

            border: none;

            background: transparent;

            cursor: pointer;
        }


        input[type="file"]:focus {

            box-shadow: none;
        }


        /* =========================================
           BOTÃO
        ========================================== */

        button {

            width: 100%;

            height: 53px;

            margin-top: 8px;

            border: none;

            border-radius: 9px;

            background: #0B2239;

            color: #FFFFFF;

            font-family: "Montserrat", sans-serif;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 0.2px;

            cursor: pointer;

            transition: all 0.25s ease;
        }


        button:hover {

            background: #071A2B;

            transform: translateY(-1px);

            box-shadow:
                0 9px 22px rgba(11, 34, 57, 0.20);
        }


        button:active {

            transform: translateY(0);
        }


        /* =========================================
           SEGURANÇA
        ========================================== */

        .seguranca {

            display: flex;

            align-items: center;

            gap: 9px;

            margin-top: 23px;

            padding-top: 18px;

            border-top: 1px solid #DDE5EA;

            color: #778995;

            font-family: "Montserrat", sans-serif;

            font-size: 9px;

            line-height: 1.5;
        }


        .seguranca-icon {

            color: #0B2239;

            font-size: 13px;
        }


        /* =========================================
           RESPONSIVIDADE
        ========================================== */

        @media (max-width: 600px) {

            body {

                padding: 18px;
            }


            .container {

                padding: 30px 24px;

                border-radius: 16px;
            }


            .title-area h1 {

                font-size: 36px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         ATENDIMENTO
    ========================================== -->

    <main class="container">


        <!-- IDENTIDADE -->

        <div class="hospital-logo">

            <div class="logo-icon">
                +
            </div>


            <div>

                <div class="hospital-name">
                    Hospital
                </div>


                <div class="hospital-subtitle">
                    CUIDADO • CONFIANÇA • ACOLHIMENTO
                </div>

            </div>

        </div>



        <!-- TÍTULO -->

        <div class="title-area">

            <h1>
                Atendimento
            </h1>


            <p>
                Preencha os dados abaixo para cadastrar o paciente
                e encaminhá-lo para a triagem.
            </p>

        </div>



        <!-- FORMULÁRIO -->

        <form id="formAtendimento">


            <!-- NOME -->

            <div class="campo">

                <label for="nome">
                    NOME COMPLETO
                </label>


                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome completo"
                    required
                >

            </div>



            <!-- CPF -->

            <div class="campo">

                <label for="cpf">
                    CPF
                </label>


                <input
                    type="text"
                    id="cpf"
                    placeholder="Digite o CPF"
                    maxlength="14"
                    required
                >

            </div>



            <!-- TIPO -->

            <div class="campo">

                <label for="tipo">
                    TIPO DE ATENDIMENTO
                </label>


                <select id="tipo" required>

                    <option value="" disabled selected>
                        Selecione uma opção
                    </option>


                    <option value="Convenio">
                        Convênio
                    </option>


                    <option value="Particular">
                        Particular
                    </option>

                </select>

            </div>



            <!-- FOTO -->

            <div class="campo">

                <label for="foto">
                    FOTO DO PACIENTE
                </label>


                <div class="upload-area">

                    <input
                        type="file"
                        id="foto"
                        accept="image/*"
                    >

                </div>

            </div>



            <!-- BOTÃO -->

            <button type="submit">
                CADASTRAR PACIENTE
            </button>


        </form>



        <!-- SEGURANÇA -->

        <div class="seguranca">

            <span class="seguranca-icon">
                🔒
            </span>


            <span>
                Os dados informados são utilizados exclusivamente
                para o atendimento e triagem do paciente.
            </span>

        </div>


    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        /* =========================================
           FORMULÁRIO
        ========================================== */

        const form =
            document.getElementById("formAtendimento");


        form.addEventListener("submit", function(event) {

            event.preventDefault();


            const nome =
                document.getElementById("nome").value;


            const cpf =
                document.getElementById("cpf").value;


            const tipo =
                document.getElementById("tipo").value;


            fetch(
                "http://localhost:3000/atendimento",
                {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        nome: nome,

                        cpf: cpf,

                        tipo: tipo

                    })

                }
            )


            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Erro ao cadastrar paciente."
                    );

                }

                return response.json();

            })


            .then(data => {

                alert(
                    "Paciente enviado para triagem!"
                );

                form.reset();

            })


            .catch(error => {

                console.error(error);

                alert(
                    "Não foi possível enviar o paciente para a triagem."
                );

            });

        });



        /* =========================================
           MÁSCARA DE CPF
        ========================================== */

        document
            .getElementById("cpf")
            .addEventListener("input", function(event) {


                let valor =
                    event.target.value
                    .replace(/\D/g, "")
                    .slice(0, 11);


                valor = valor.replace(
                    /(\d{3})(\d)/,
                    "$1.$2"
                );


                valor = valor.replace(
                    /(\d{3})(\d)/,
                    "$1.$2"
                );


                valor = valor.replace(
                    /(\d{3})(\d{1,2})$/,
                    "$1-$2"
                );


                event.target.value = valor;

            });

    </script>


</body>

</html>
