```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atendimento | Hospital</title>

    <style>
        /* ========================================
           CONFIGURAÇÕES GERAIS
        ======================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7f9;
            color: #263238;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        /* ========================================
           CONTAINER PRINCIPAL
        ======================================== */

        .container {
            width: 100%;
            max-width: 500px;

            background: #ffffff;

            padding: 42px;

            border: 1px solid #e1e6ea;
            border-radius: 18px;

            box-shadow: 0 15px 40px rgba(7, 26, 43, 0.08);
        }

        /* ========================================
           CABEÇALHO
        ======================================== */

        .hospital-logo {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 35px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;

            background: #102a43;
            color: white;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
            font-weight: bold;
        }

        .hospital-name {
            color: #071a2b;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .hospital-subtitle {
            color: #7b8790;
            font-size: 12px;
            margin-top: 2px;
        }

        /* ========================================
           TÍTULO
        ======================================== */

        .title-area {
            margin-bottom: 28px;
        }

        .title-area h1 {
            color: #071a2b;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .title-area p {
            color: #657786;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ========================================
           FORMULÁRIO
        ======================================== */

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;

            color: #263238;

            font-size: 13px;
            font-weight: 600;

            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            height: 50px;

            padding: 0 15px;

            border: 1px solid #d9e0e5;
            border-radius: 9px;

            background: #fbfcfd;

            color: #263238;
            font-size: 15px;

            outline: none;

            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #8a969e;
        }

        input:focus,
        select:focus {
            border-color: #102a43;

            background: #ffffff;

            box-shadow: 0 0 0 3px rgba(16, 42, 67, 0.08);
        }

        select {
            cursor: pointer;
        }

        /* ========================================
           UPLOAD DA FOTO
        ======================================== */

        .upload-area {
            border: 1px dashed #cbd5dc;
            border-radius: 10px;

            background: #fafbfc;

            padding: 15px;

            transition: 0.2s ease;
        }

        .upload-area:hover {
            border-color: #102a43;
            background: #f5f8fa;
        }

        input[type="file"] {
            height: auto;
            padding: 5px;

            border: none;
            background: transparent;

            cursor: pointer;
        }

        input[type="file"]:focus {
            box-shadow: none;
        }

        /* ========================================
           BOTÃO
        ======================================== */

        button {
            width: 100%;
            height: 52px;

            margin-top: 8px;

            border: none;
            border-radius: 9px;

            background: #102a43;
            color: #ffffff;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: all 0.2s ease;
        }

        button:hover {
            background: #071a2b;

            transform: translateY(-1px);

            box-shadow: 0 8px 20px rgba(7, 26, 43, 0.18);
        }

        button:active {
            transform: translateY(0);
        }

        /* ========================================
           MENSAGEM DE SEGURANÇA
        ======================================== */

        .seguranca {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-top: 22px;

            padding-top: 18px;

            border-top: 1px solid #edf0f2;

            color: #7b8790;

            font-size: 11px;
            line-height: 1.4;
        }

        .seguranca-icon {
            color: #102a43;
            font-size: 14px;
        }

        /* ========================================
           RESPONSIVIDADE
        ======================================== */

        @media (max-width: 600px) {

            body {
                padding: 18px;
            }

            .container {
                padding: 30px 24px;
                border-radius: 15px;
            }

            .title-area h1 {
                font-size: 24px;
            }
        }
    </style>
</head>


<body>

    <main class="container">

        <!-- IDENTIDADE DO HOSPITAL -->
        <div class="hospital-logo">

            <div class="logo-icon">
                +
            </div>

            <div>
                <div class="hospital-name">
                    Hospital
                </div>

                <div class="hospital-subtitle">
                    Cuidado, confiança e acolhimento
                </div>
            </div>

        </div>


        <!-- TÍTULO -->
        <div class="title-area">

            <h1>
                Atendimento
            </h1>

            <p>
                Preencha os dados abaixo para cadastrar o paciente
                e encaminhá-lo para a triagem.
            </p>

        </div>


        <!-- FORMULÁRIO -->
        <form id="formAtendimento">

            <!-- NOME -->
            <div class="campo">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome completo"
                    required
                >

            </div>


            <!-- CPF -->
            <div class="campo">

                <label for="cpf">
                    CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    placeholder="Digite o CPF"
                    maxlength="14"
                    required
                >

            </div>


            <!-- TIPO DE ATENDIMENTO -->
            <div class="campo">

                <label for="tipo">
                    Tipo de atendimento
                </label>

                <select id="tipo" required>

                    <option value="" disabled selected>
                        Selecione uma opção
                    </option>

                    <option value="Convenio">
                        Convênio
                    </option>

                    <option value="Particular">
                        Particular
                    </option>

                </select>

            </div>


            <!-- FOTO -->
            <div class="campo">

                <label for="foto">
                    Foto do paciente
                </label>

                <div class="upload-area">

                    <input
                        type="file"
                        id="foto"
                        accept="image/*"
                    >

                </div>

            </div>


            <!-- BOTÃO -->
            <button type="submit">
                Cadastrar paciente
            </button>

        </form>


        <!-- AVISO -->
        <div class="seguranca">

            <span class="seguranca-icon">
                🔒
            </span>

            <span>
                Os dados informados são utilizados exclusivamente
                para o atendimento e triagem do paciente.
            </span>

        </div>

    </main>


    <script>

        /* ========================================
           FORMULÁRIO DE ATENDIMENTO
        ======================================== */

        const form = document.getElementById("formAtendimento");

        form.addEventListener("submit", function(event) {

            event.preventDefault();


            /* Pegando os valores dos campos */

            const nome = document.getElementById("nome").value;

            const cpf = document.getElementById("cpf").value;

            const tipo = document.getElementById("tipo").value;


            /* Enviando os dados para o servidor */

            fetch("http://localhost:3000/atendimento", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    nome: nome,

                    cpf: cpf,

                    tipo: tipo

                })

            })

            .then(response => {

                if (!response.ok) {
                    throw new Error("Erro ao cadastrar paciente.");
                }

                return response.json();

            })

            .then(data => {

                alert("Paciente enviado para triagem!");

                form.reset();

            })

            .catch(error => {

                console.error(error);

                alert(
                    "Não foi possível enviar o paciente para a triagem."
                );

            });

        });


        /* ========================================
           MÁSCARA DE CPF
        ======================================== */

        document
            .getElementById("cpf")
            .addEventListener("input", function(event) {

                let valor = event.target.value
                    .replace(/\D/g, "")
                    .slice(0, 11);

                valor = valor.replace(
                    /(\d{3})(\d)/,
                    "$1.$2"
                );

                valor = valor.replace(
                    /(\d{3})(\d)/,
                    "$1.$2"
                );

                valor = valor.replace(
                    /(\d{3})(\d{1,2})$/,
                    "$1-$2"
                );

                event.target.value = valor;

            });

    </script>

</body>

</html>
